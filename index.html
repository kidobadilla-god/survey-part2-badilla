<!DOCTYPE html>
<html>
	<head>
		<title>Police Questionnaire</title>
		<link rel="stylesheet" href="styles.css">
		<script>
			// must be logged in to see this page
			if (!localStorage.getItem('username')) {
				document.location.href = 'login.html';
			}
		</script>
	</head>

	<body>
		First Name
		<input id='first_name' type='text'>
		Last Name
		<input id='sur_name' type='text'>
		Middle Name
		<input id='middle_name' type='text'>
		Suffix
		<input id='suffix' type='text'>
		Birthday
		<input id='birthday_date' type='text'>
		Age
		<input id='age' type='number'>
		Where do you live?
		<input id='where' type='text'>
		Place of birth
		<input id='place' type='text'>
		Civil Status
		<input id='civil_status' type='text'>
		Religion
		<input id='religion' type='text'>

		<div id='message' class='message'></div>

		<button type="button" onclick="submitSurvey()">Click Me!</button>
		<button type="button" onclick="logout()">Log out</button>

		<script>
			const fields = ['first_name', 'sur_name', 'middle_name', 'suffix', 'birthday_date',
				'age', 'where', 'place', 'civil_status', 'religion'];

			async function submitSurvey() {
				const postData = {};
				fields.forEach(id => { postData[id] = document.getElementById(id).value; });

				const message = document.getElementById('message');

				try {
					const response = await fetch('http://127.0.0.1:8000/Survey', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(postData)
					});
					const result = await response.json();

					if (response.ok && result.status === 'success') {
						document.location.href = 'profile.html.html';
					} else {
						message.textContent = 'Please fill in every field correctly (age must be a number).';
					}
				} catch (error) {
					console.error('Error:', error);
					message.textContent = 'Cannot reach the server. Is it running?';
				}
			}

			function logout() {
				localStorage.removeItem('username');
				document.location.href = 'login.html';
			}
		</script>
	</body>
</html>
