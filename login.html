<!DOCTYPE html>
<html>
	<head>
		<title>Police Questionnaire</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		username
		<input id = 'username' type='text'>
		password
		<input id = 'password' type='text'>
		
		<a href="register.html"> Sign up </a>
        <button type = 'button' href="index.html"> Login </button>


		<button type="button" onclick="clickButton( 
			document.getElementById('username').value ,
			document.getElementById('password').value )"> Log in!
		</button>

		<script>


		

		const clickButton = (a,b) => {

			const postData = {
				username:a,
				password:b,


			};

			console.log(postData)

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/Survey',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'index.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
